<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            // Total citations: fills <span id='total_cit'> if the page has one
            var totalEl = document.getElementById('total_cit');
            if (totalEl && data['citedby'] !== undefined) {
                totalEl.innerHTML = data['citedby'];
            }
            // Per-paper citations: <span class='show_paper_citations' data='SCHOLAR_PAPER_ID'>
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data');
                var pub = data['publications'] && data['publications'][paperId];
                if (pub && pub['num_citations'] !== undefined) {
                    element.innerHTML = '| Citations: ' + pub['num_citations'];
                }
            });
        });
    })
</script>
