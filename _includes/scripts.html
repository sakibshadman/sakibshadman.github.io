<script>
/* Date and Eastern Time in the sidebar */
document.addEventListener("DOMContentLoaded", function () {

  var dateEl = document.getElementById("dclock-date");
  var timeEl = document.getElementById("dclock-time");

  function tick() {
    if (!dateEl && !timeEl) { return; }
    var now = new Date();

    if (dateEl) {
      dateEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric"
      }).format(now);
    }

    if (timeEl) {
      timeEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(now) + " EST";
    }
  }

  tick();
  setInterval(tick, 10000);

  /* Back to top ---------------------------------------------------------- */

  var topBtn = document.getElementById("to-top");
  if (!topBtn) { return; }

  function toggleTop() {
    if (window.scrollY > 600) { topBtn.classList.add("is-on"); }
    else { topBtn.classList.remove("is-on"); }
  }

  toggleTop();
  window.addEventListener("scroll", toggleTop, { passive: true });

  topBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var summaries = document.querySelectorAll("details > summary");

  summaries.forEach(function (summary) {
    summary.addEventListener("click", function (event) {
      event.preventDefault();

      var details = summary.parentElement;

      if (!details) {
        return;
      }

      if (details.hasAttribute("open")) {
        details.removeAttribute("open");
      } else {
        details.setAttribute("open", "");
      }
    });
  });
});
</script>
