<script>
/* Date and Eastern Time in the sidebar */
document.addEventListener("DOMContentLoaded", function () {

  var dateEl = document.getElementById("dclock-date");
  var timeEl = document.getElementById("dclock-time");

  function tick() {
    if (!dateEl && !timeEl) { return; }
    var now = new Date();

    if (dateEl) {
      dateEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric"
      }).format(now);
    }

    if (timeEl) {
      timeEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(now) + " EST";
    }
  }

  tick();
  setInterval(tick, 10000);

  /* Back to top ---------------------------------------------------------- */

  var topBtn = document.getElementById("to-top");
  if (!topBtn) { return; }

  function toggleTop() {
    if (window.scrollY > 600) { topBtn.classList.add("is-on"); }
    else { topBtn.classList.remove("is-on"); }
  }

  toggleTop();
  window.addEventListener("scroll", toggleTop, { passive: true });

  topBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});
</script>

<script>
/* Research Highlights: category filter tabs */
document.addEventListener("DOMContentLoaded", function () {
  var tabs = document.querySelectorAll(".hl-tab");
  var cards = document.querySelectorAll(".paper-box[data-cat]");
  if (!tabs.length || !cards.length) { return; }

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var f = tab.getAttribute("data-filter");
      tabs.forEach(function (t) {
        var on = (t === tab);
        t.classList.toggle("is-active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
      });
      cards.forEach(function (c) {
        var show = (f === "all") || (c.getAttribute("data-cat") === f);
        c.style.display = show ? "" : "none";
      });
    });
  });
});
</script>

<script>
/* Research Highlights: click-to-enlarge lightbox */
document.addEventListener("DOMContentLoaded", function () {
  var figures = document.querySelectorAll(".paper-box-image");
  if (!figures.length) { return; }

  /* Build the lightbox once */
  var lb = document.createElement("div");
  lb.className = "lightbox";
  lb.setAttribute("aria-hidden", "true");
  lb.innerHTML =
    '<button type="button" class="lightbox__close" aria-label="Close (Esc)">&times;</button>' +
    '<figure class="lightbox__fig">' +
      '<img class="lightbox__img" alt="">' +
      '<figcaption class="lightbox__cap"></figcaption>' +
    '</figure>';
  document.body.appendChild(lb);

  var lbImg   = lb.querySelector(".lightbox__img");
  var lbCap   = lb.querySelector(".lightbox__cap");
  var closeBt = lb.querySelector(".lightbox__close");

  function openLightbox(src, caption) {
    lbImg.src = src;
    lbImg.alt = caption || "";
    if (caption) { lbCap.textContent = caption; lbCap.style.display = ""; }
    else { lbCap.textContent = ""; lbCap.style.display = "none"; }
    lb.classList.add("is-open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lb.classList.remove("is-open");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    lbImg.src = "";
  }

  figures.forEach(function (box) {
    var img = box.querySelector("img");
    if (!img) { return; }

    box.style.cursor = "zoom-in";
    box.setAttribute("role", "button");
    box.setAttribute("tabindex", "0");
    box.setAttribute("aria-label", "Enlarge figure" + (img.alt ? ": " + img.alt : ""));

    box.addEventListener("click", function () {
      openLightbox(img.currentSrc || img.src, img.alt);
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openLightbox(img.currentSrc || img.src, img.alt);
      }
    });
  });

  closeBt.addEventListener("click", closeLightbox);
  lb.addEventListener("click", function (e) { if (e.target === lb) { closeLightbox(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lb.classList.contains("is-open")) { closeLightbox(); }
  });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var summaries = document.querySelectorAll("details > summary");

  summaries.forEach(function (summary) {
    summary.addEventListener("click", function (event) {
      event.preventDefault();

      var details = summary.parentElement;

      if (!details) {
        return;
      }

      if (details.hasAttribute("open")) {
        details.removeAttribute("open");
      } else {
        details.setAttribute("open", "");
      }
    });
  });
});
</script>
